/* IMV mobile/auth refresh */
html,body,#app{min-height:100%;min-height:100dvh}
.splash-screen{position:fixed;inset:0;z-index:9999;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:#050505;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.splash-screen:before,.splash-screen:after{content:"";position:absolute;border-radius:50%;filter:blur(16px);pointer-events:none}
.splash-screen:before{width:min(620px,130vw);height:min(620px,130vw);background:radial-gradient(circle,rgba(255,255,255,.12),rgba(120,120,120,.05) 38%,transparent 70%);animation:splashAura 1.8s ease-in-out both}
.splash-screen:after{width:min(380px,92vw);height:min(380px,92vw);border:1px solid rgba(255,255,255,.10);box-shadow:0 0 80px rgba(255,255,255,.08),inset 0 0 65px rgba(255,255,255,.035);animation:splashRing 1.8s ease-in-out both}
.splash-inner{position:relative;z-index:2;text-align:center;width:min(520px,100%)}
.splash-logo{display:block;width:min(360px,82vw);max-height:260px;object-fit:contain;margin:0 auto 24px;filter:drop-shadow(0 18px 34px rgba(0,0,0,.8)) drop-shadow(0 0 18px rgba(255,255,255,.10));animation:splashLogo 1.8s cubic-bezier(.22,.8,.22,1) both}
.splash-church{font-size:13px;letter-spacing:.19em;text-transform:uppercase;font-weight:800;color:#f2f2f2;animation:splashText 1.8s ease both}
.splash-ministry{margin-top:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#777;animation:splashText 1.8s .08s ease both}
@keyframes splashLogo{0%{opacity:0;transform:scale(.91);filter:blur(10px) drop-shadow(0 0 0 transparent)}30%{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 20px 36px rgba(0,0,0,.82)) drop-shadow(0 0 18px rgba(255,255,255,.12))}72%{opacity:1;transform:scale(1.015)}100%{opacity:0;transform:scale(1.05);filter:blur(3px) drop-shadow(0 0 28px rgba(255,255,255,.05))}}
@keyframes splashAura{0%,100%{opacity:0;transform:scale(.76)}35%,70%{opacity:1;transform:scale(1)}}
@keyframes splashRing{0%,100%{opacity:0;transform:scale(.8)}35%,70%{opacity:.8;transform:scale(1)}}
@keyframes splashText{0%,16%{opacity:0;transform:translateY(8px)}38%,72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
.auth-screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#171717 0,#090909 28%,#050505 66%);padding:max(30px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

      const button=document.getElementById('loginSubmit');

      try{

        let login=await supabaseClient.auth.signInWithPassword({email,password});

        console.error(err);
        photoInput.value='';
        toast(err?.message||'Não foi possível carregar a foto.','error');
      }
    });

    window.onpagehide=saveDraft;
    document.onvisibilitychange=()=>{if(document.hidden)saveDraft();};

    form?.addEventListener('submit',async e=>{
      e.preventDefault();
      saveDraft();
      const fullName=nameInput.value.trim().replace(/\s+/g,' ');
      const birthDate=birth.value;
      const phone=phoneInput.value.trim();
      if(fullName.split(' ').filter(Boolean).length<2) return toast('Digite seu nome completo.','error');
      if(!birthDate) return toast('Informe sua data de nascimento.','error');

      const button=document.getElementById('firstAccessSubmit');
      button.disabled=true;button.textContent='Salvando…';
      try{
        const draft=loadFirstAccessDraft();
        const avatar_url=photoInput?.dataset.avatarDataUrl||draft.avatar_url||state.user.avatar_url||'';

        if(state.mustChangePassword){
          const password=document.getElementById('firstNewPassword').value;
          const confirm=document.getElementById('firstNewPasswordConfirm').value;
          if(password.length<8) throw new Error('Use pelo menos 8 caracteres.');
          if(password!==confirm) throw new Error('As senhas não conferem.');
          const updated=await supabaseClient.auth.updateUser({password});
          if(updated.error) throw updated.error;
        }

        const patch={name:fullName,phone,birth_date:birthDate,avatar_url,onboarding_complete:true,must_change_password:false};
        const saved=await supabaseClient.from('profiles').update(patch).eq('id',state.user.id);
        if(saved.error) throw saved.error;
        Object.assign(state.user,patch);
        const member=findMember(state.user.id);if(member)Object.assign(member,patch);
        state.mustChangePassword=false;
        clearFirstAccessDraft();
        window.onpagehide=null;
        document.onvisibilitychange=null;
        await ensureBirthdayAlert();
        if(state.user.role==='admin') await ensureRollingSchedule({silent:true});
        render();
        toast('Cadastro concluído.');
      }catch(err){
        console.error(err);
        button.disabled=false;button.textContent='Concluir cadastro';
        saveDraft();
        toast(err?.message||'Não foi possível concluir o cadastro.','error');
      }
    });
  }

  function calendarView(){
    const d=state.calendarCursor, y=d.getFullYear(),m=d.getMonth();
    const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay()), cells=[];
    for(let i=0;i<42;i++){const day=new Date(start);day.setDate(start.getDate()+i);cells.push(day);}
    const upcoming=visibleEvents().filter(e=>e.event_date>=isoDate(new Date())).sort((a,b)=>a.event_date.localeCompare(b.event_date)).slice(0,8);
    const monthKey=`${y}-${String(m+1).padStart(2,'0')}`;
    const monthEvents=visibleEvents().filter(e=>e.event_date.startsWith(monthKey)).sort((a,b)=>a.event_date.localeCompare(b.event_date)||(a.time_start||'').localeCompare(b.time_start||''));
    const monthLabel=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(d);
    return `<div class="calendar-shell"><section class="calendar"><div class="calendar-head"><div><div class="small muted">AGENDA</div><div class="calendar-title">${monthLabel}</div></div><div class="cal-controls"><button class="icon-btn" id="prevMonth">‹</button><button class="ghost-btn" id="todayBtn">Hoje</button><button class="icon-btn" id="nextMonth">›</button>${can('create_event')?'<button class="white-btn calendar-create-top" id="newEventTop">+ Criar evento</button>':''}${state.user.role==='admin'?'<button class="ghost-btn calendar-create-top" id="generateSchedule">Gerar / atualizar 2 meses</button>':''}</div></div>
      <div class="mobile-calendar-list"><div class="mobile-calendar-month">Eventos de ${monthLabel}</div>${monthEvents.length?monthEvents.map(eventCard).join(''):'<div class="empty">Nenhum evento neste mês.</div>'}</div>
      <div class="cal-week">${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-grid">${cells.map(day=>{const key=isoDate(day), events=visibleEvents().filter(e=>e.event_date===key);return `<div class="day ${day.getMonth()!==m?'outside':''} ${key===isoDate(new Date())?'today':''}" data-day="${key}"><div class="day-num">${day.getDate()}</div>${events.slice(0,3).map(e=>`<div class="event-pill ${eventAssignments(e).length<(e.required_functions||[]).length?'alert':''}" data-event="${e.id}"><b>${esc(e.event_type)}</b><span class="time">${esc(e.time_start||'')}</span></div>`).join('')}${events.length>3?`<div class="tiny muted">+${events.length-3}</div>`:''}</div>`}).join('')}</div></section>

  }

  function modalWrap(title,body,actions=''){return `<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><b>${esc(title)}</b><button class="icon-btn" id="closeModal">×</button></div><div class="modal-body">${body}</div>${actions?`<div class="modal-actions">${actions}</div>`:''}</div></div>`;}

  function eventModal(m){

    return modalWrap('Criar evento',`<form id="eventForm" class="form-grid"><div class="field"><label>Tipo</label><select class="select" id="eventType">${eventTypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Nome do evento</label><input class="input" id="eventTitle" placeholder="Ex.: Culto de terça"></div><div class="field"><label>Data</label><input class="input" id="eventDate" type="date" value="${date}" required></div><div class="field"><label>Horário</label><input class="input" id="eventTime" type="time" value="19:30" required></div><div class="field"><label>Ministro / responsável</label><select class="select" id="eventMinister"><option value="">A definir</option>${state.members.filter(x=>x.active!==false&&(x.functions||[]).includes('Ministro')).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Local</label><input class="input" id="eventLocation" value="IMV"></div><div class="field full"><label>Equipe necessária</label><div class="schedule-groups">${slotOptions}</div></div><div class="field full"><label>Observações</label><textarea class="textarea" id="eventNotes"></textarea></div></form>`,`<button class="ghost-btn" id="cancelModal">Cancelar</button><button class="white-btn" id="saveEvent">Criar e abrir escala</button>`);
  }

  function slotCandidates(slot){
    const needed=slotFunction(slot);
    return state.members.filter(m=>m.active!==false&&(m.functions||[]).includes(needed)).sort((a,b)=>a.name.localeCompare(b.name));
  }

  function eventDetailModal(e){
    const assigns=eventAssignments(e);
    const slots=[...new Set((e.required_functions?.length?e.required_functions:coreEventSlots))];
    const missing=slots.filter(f=>!assigns.some(a=>(a.function_name||a.function)===f));
    const groups=scheduleGroups.map(group=>{
      const groupSlots=group.slots.filter(slot=>slots.includes(slot));
      if(!groupSlots.length)return '';
      const rows=groupSlots.map(fn=>{
        const a=assigns.find(x=>(x.function_name||x.function)===fn);
        const person=a?findMember(a.user_id):null;
        if(can('edit_event')){
          const options=slotCandidates(fn).map(m=>`<option value="${m.id}" ${a?.user_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('');
          return `<div class="schedule-slot"><div class="schedule-slot-name">${esc(fn)}</div><select class="select" data-manual-slot="${esc(fn)}" data-event-id="${e.id}"><option value="">A definir</option>${options}</select></div>`;
        }
        return `<div class="schedule-slot"><div class="schedule-slot-name">${esc(fn)}</div><div class="member-cell">${person?avatar(person):'<div class="avatar">—</div>'}<div><b>${person?esc(person.name):'A definir'}</b></div></div></div>`;
      }).join('');
      return `<section class="schedule-group"><div class="schedule-group-head">${esc(group.label)}</div>${rows}</section>`;
    }).join('');

    return modalWrap(e.title,`<div class="chips"><span class="chip white">${esc(e.event_type)}</span><span class="chip">${fmtFullDate(e.event_date)} • ${esc(e.time_start||'')}</span><span class="chip">Ministro responsável: ${esc(memberName(e.minister_id))}</span></div><div class="divider"></div><div class="section-head"><div><h2 style="font-size:15px">Escala</h2><div class="tiny muted">${can('edit_event')?'Toque em cada posição para escolher a pessoa.':'Equipe definida para este evento.'}</div></div>${can('auto_schedule')?`<button class="white-btn" data-auto="${e.id}">Autoescalar</button>`:''}</div><div class="schedule-groups">${groups}</div>${missing.length?`<div style="margin-top:14px" class="chip danger">Ainda sem pessoa: ${missing.map(esc).join(', ')}</div>`:''}<div class="divider"></div><div class="toolbar"><button class="ghost-btn" data-whatsapp="${e.id}">Enviar escala no WhatsApp</button>${can('edit_event')?`<button class="ghost-btn" data-auto="${e.id}">Refazer autoescala</button><button class="danger-btn" data-delete-event="${e.id}">Excluir escala/evento</button>`:''}</div>`,`<button class="ghost-btn" id="cancelModal">Fechar</button>`);
  }

  function syncEventDefaults(){const t=document.getElementById('eventType');if(!t)return;const title=document.getElementById('eventTitle'),time=document.getElementById('eventTime');if(!title||title.dataset.touched)return;const map={'Terça-feira':['Culto de Terça','19:30'],'Domingo • Manhã':['Culto de Domingo • Manhã','09:00'],'Domingo • Noite':['Culto de Domingo • Noite','19:00'],'BRAVE':['BRAVE','19:00'],'Culto de Mulheres':['Culto de Mulheres','19:30'],'Outro':['','19:00']};title.value=map[t.value][0];time.value=map[t.value][1];}

  async function saveEvent(){
    const title=eventTitle.value.trim()||eventType.value, required=[...document.querySelectorAll('input[name=requiredFn]:checked')].map(x=>x.value);
    const base={title,event_type:eventType.value,event_date:eventDate.value,time_start:eventTime.value,time_end:null,location:eventLocation.value.trim(),minister_id:eventMinister.value||null,created_by:state.user.id,status:'draft',required_functions:required,notes:eventNotes.value.trim()};
    let e={...base,id:uid(),assignments:[]};
    if(supabaseClient){const {data,error}=await supabaseClient.from('events').insert(base).select().single();if(error)return toast(error.message,'error');e={...data,assignments:[]};}
    state.events.push(e); store.saveDemo(); state.modal={type:'eventDetail',event:e};render(); toast('Evento criado.');
  }

  function isUnavailable(userId,date){return state.unavailability.some(u=>u.user_id===userId && date>=u.start_date && date<=u.end_date);}
  function monthlyCount(userId,date){const ym=date.slice(0,7);return visibleEvents().filter(e=>e.event_date.startsWith(ym)).flatMap(eventAssignments).filter(a=>a.user_id===userId).length;}
  function candidateFor(fn,e,used){const needed=slotFunction(fn);return state.members.filter(m=>m.active!==false && (m.functions||[]).includes(needed) && !used.has(m.id) && !isUnavailable(m.id,e.event_date)).filter(m=>!visibleEvents().some(other=>other.id!==e.id&&other.event_date===e.event_date&&eventAssignments(other).some(a=>a.user_id===m.id))).sort((a,b)=>monthlyCount(a.id,e.event_date)-monthlyCount(b.id,e.event_date)||a.name.localeCompare(b.name))[0];}

  function computeAutoSchedule(e){
    const used=new Set(),result=[],missing=[];
    for(const fn of (e.required_functions||coreEventSlots)){
      let c=null;
      if(fn==='Ministro'&&e.minister_id){const m=findMember(e.minister_id);if(m&&!isUnavailable(m.id,e.event_date))c=m;}
      if(!c)c=candidateFor(fn,e,used);
      if(c){used.add(c.id);result.push({id:uid(),event_id:e.id,user_id:c.id,function_name:fn,confirmation_status:'pending'});} else missing.push(fn);
    }
    return {result,missing};
  }

  async function autoSchedule(eventId,options={}){
    const e=state.events.find(x=>x.id===eventId);if(!e)return;
    const {result,missing}=computeAutoSchedule(e);
    if(supabaseClient){
      const del=await supabaseClient.from('event_assignments').delete().eq('event_id',e.id);if(del.error)return toast(del.error.message,'error');
      if(result.length){const payload=result.map(({id,...r})=>r);const ins=await supabaseClient.from('event_assignments').insert(payload).select();if(ins.error)return toast(ins.error.message,'error');result.splice(0,result.length,...ins.data);}
    }
    e.assignments=result;
    if(missing.length){await addNotification(e.minister_id||e.created_by,'Não foi possível fechar a escala',`No evento ${e.title}, não há ninguém disponível para: ${missing.join(', ')}.`,'no_available');}
    for(const a of result){await addNotification(a.user_id,'Você foi escalado',`${e.title} • ${fmtDate(e.event_date)} • ${a.function_name}.`,'assignment');}
    store.saveDemo();
    if(!options.silent){state.modal={type:'eventDetail',event:e};render();toast(missing.length?'Escala montada com pendências.':'Escala montada automaticamente.',missing.length?'error':'');}
    return {result,missing};
  }

  async function setManualAssignment(eventId,slot,userId){
    const e=state.events.find(x=>x.id===eventId);if(!e||!can('edit_event'))return;
    const previous=eventAssignments(e).find(a=>(a.function_name||a.function)===slot);
    let inserted=null;
    if(supabaseClient){
      const del=await supabaseClient.from('event_assignments').delete().eq('event_id',eventId).eq('function_name',slot);
      if(del.error)return toast(del.error.message,'error');
      if(userId){
        const res=await supabaseClient.from('event_assignments').insert({event_id:eventId,user_id:userId,function_name:slot,confirmation_status:'pending'}).select().single();
        if(res.error)return toast(res.error.message,'error');
        inserted=res.data;
      }
    }else if(userId){inserted={id:uid(),event_id:eventId,user_id:userId,function_name:slot,confirmation_status:'pending'};}
    e.assignments=eventAssignments(e).filter(a=>(a.function_name||a.function)!==slot);
    if(inserted)e.assignments.push(inserted);
    if(userId && previous?.user_id!==userId) await addNotification(userId,'Você foi escalado',`${e.title} • ${fmtDate(e.event_date)} • ${slot}.`,'assignment');
    state.modal={type:'eventDetail',event:e};render();toast(userId?'Escala atualizada.':'Posição deixada como “A definir”.');
  }

  async function deleteEvent(eventId){
    const e=state.events.find(x=>x.id===eventId);if(!e||!can('edit_event'))return;
    if(!window.confirm('Excluir esta escala/evento da agenda?'))return;
    if(supabaseClient){
      const delAssign=await supabaseClient.from('event_assignments').delete().eq('event_id',eventId);if(delAssign.error)return toast(delAssign.error.message,'error');
      const upd=await supabaseClient.from('events').update({status:'cancelled'}).eq('id',eventId);if(upd.error)return toast(upd.error.message,'error');
    }
    e.status='cancelled';e.assignments=[];state.modal=null;render();toast('Evento removido da agenda.');
  }

  async function ensureRecurringEvents(){
    if(!supabaseClient||state.user?.role!=='admin')return 0;
    const start=new Date();start.setHours(12,0,0,0);
    const end=new Date(start);end.setMonth(end.getMonth()+2);
    const templates=[
      {dow:2,key:'weekly-tuesday',title:'Culto de Terça',event_type:'Terça-feira',time_start:'19:30'},
      {dow:0,key:'weekly-sunday-am',title:'Culto de Domingo • Manhã',event_type:'Domingo • Manhã',time_start:'09:00'},
      {dow:0,key:'weekly-sunday-pm',title:'Culto de Domingo • Noite',event_type:'Domingo • Noite',time_start:'19:00'}
    ];
    const existing=new Set(state.events.filter(e=>e.recurrence_key).map(e=>`${e.recurrence_key}:${e.event_date}`));
    const rows=[];
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      for(const t of templates){
        if(d.getDay()!==t.dow)continue;
        const date=isoDate(d),key=`${t.key}:${date}`;
        if(existing.has(key))continue;
        rows.push({title:t.title,event_type:t.event_type,event_date:date,time_start:t.time_start,time_end:null,location:'IMV',minister_id:null,created_by:state.user.id,status:'published',required_functions:coreEventSlots,notes:'Gerado automaticamente pelo ciclo de 2 meses.',recurrence_key:t.key});
        existing.add(key);
      }
    }
    if(!rows.length)return 0;
    const ins=await supabaseClient.from('events').insert(rows).select();
    if(ins.error){console.error(ins.error);toast('Não foi possível atualizar os cultos recorrentes.','error');return 0;}
    state.events.push(...ins.data.map(e=>({...e,assignments:[]})));
    return ins.data.length;
  }

  async function ensureRollingSchedule({silent=false}={}){
    if(!supabaseClient||state.user?.role!=='admin'||!state.user?.onboarding_complete)return;
    const created=await ensureRecurringEvents();
    const today=isoDate(new Date());
    const horizonDate=new Date();horizonDate.setMonth(horizonDate.getMonth()+2);
    const horizon=isoDate(horizonDate);
    const targets=visibleEvents().filter(e=>e.event_date>=today&&e.event_date<=horizon&&!eventAssignments(e).length).sort((a,b)=>a.event_date.localeCompare(b.event_date)||(a.time_start||'').localeCompare(b.time_start||''));
    const allAssignments=[],allNotifications=[];
    let pendingCount=0;
    for(const e of targets){
      const {result,missing}=computeAutoSchedule(e);
      e.assignments=result;
      for(const a of result)allAssignments.push({event_id:e.id,user_id:a.user_id,function_name:a.function_name,confirmation_status:'pending'});
      for(const a of result)allNotifications.push({recipient_id:a.user_id,title:'Você foi escalado',body:`${e.title} • ${fmtDate(e.event_date)} • ${a.function_name}.`,type:'assignment'});
      if(missing.length){pendingCount+=missing.length;const recipient=e.minister_id||e.created_by;if(recipient)allNotifications.push({recipient_id:recipient,title:'Não foi possível fechar a escala',body:`No evento ${e.title}, não há ninguém disponível para: ${missing.join(', ')}.`,type:'no_available'});}
    }
    if(allAssignments.length){
      const ins=await supabaseClient.from('event_assignments').insert(allAssignments).select();
      if(ins.error){console.error(ins.error);return toast('Os cultos foram criados, mas houve erro ao montar as escalas.','error');}
      const byEvent=new Map();
      for(const a of ins.data){if(!byEvent.has(a.event_id))byEvent.set(a.event_id,[]);byEvent.get(a.event_id).push(a);}
      for(const e of targets)e.assignments=byEvent.get(e.id)||[];
    }
    if(allNotifications.length){
      const n=await supabaseClient.from('notifications').insert(allNotifications).select();
      if(!n.error)state.notifications.unshift(...n.data.filter(x=>x.recipient_id===state.user.id));
    }
    if(!silent){render();toast(`Agenda atualizada: ${created} culto(s) criado(s), ${targets.length} escala(s) gerada(s)${pendingCount?` e ${pendingCount} posição(ões) pendente(s)`:''}.`,pendingCount?'error':'');}
  }

  async function saveSong(){let s={id:uid(),title:songTitle.value.trim(),artist:'',default_key:songDefaultKey.value,lyrics:songLyrics.value};if(!s.title)return toast('Informe o título.','error');if(supabaseClient){const {data,error}=await supabaseClient.from('songs').insert({title:s.title,artist:'',default_key:s.default_key,lyrics:s.lyrics,created_by:state.user.id}).select().single();if(error)return toast(error.message,'error');s=data;}state.songs.push(s);state.selectedSong=s.id;state.songKey=s.default_key;store.saveDemo();state.modal=null;render();toast('Música adicionada.');}

  async function markAllRead(){state.notifications.forEach(n=>n.read=true);if(supabaseClient)await supabaseClient.from('notifications').update({read:true}).eq('recipient_id',state.user.id);store.saveDemo();render();}
  async function saveProfile(e){e.preventDefault();const name=profileName.value.trim().replace(/\s+/g,' '),phone=profilePhone.value.trim(),birth_date=profileBirthDate.value;if(name.split(' ').filter(Boolean).length<2)return toast('Digite seu nome completo.','error');if(!birth_date)return toast('Informe sua data de nascimento.','error');let avatar_url=state.user.avatar_url||'';const input=document.getElementById('profilePhoto'),f=input?.files?.[0];if(f){try{avatar_url=input.dataset.avatarDataUrl||await avatarFileToDataUrl(f);}catch(err){return toast(err?.message||'Não foi possível carregar a foto.','error');}}const patch={name,phone,birth_date,avatar_url,onboarding_complete:true};Object.assign(state.user,patch);const m=findMember(state.user.id);if(m)Object.assign(m,patch);if(supabaseClient){const {error}=await supabaseClient.from('profiles').update(patch).eq('id',state.user.id);if(error)return toast(error.message,'error');}store.saveDemo();toast('Perfil salvo.');render();}
  async function savePassword(){if(!supabaseClient)return;const password=newPassword.value;if(password.length<8)return toast('Use pelo menos 8 caracteres.','error');const {error}=await supabaseClient.auth.updateUser({password});if(error)return toast(error.message,'error');state.modal=null;render();toast('Senha atualizada.');}
  async function logout(){if(supabaseClient){await supabaseClient.auth.signOut();}else{state.user=null;localStorage.removeItem('imv-louvor-demo-v1');}state.view='dashboard';syncViewUrl('dashboard',{replace:true});render();}

  const KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FLAT_TO_SHARP={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  function keyIndex(k){return KEYS.indexOf(FLAT_TO_SHARP[k]||k);}
  function transposeChord(chord,steps){return chord.replace(/^([A-G])([#b]?)(.*)$/,(all,n,acc,rest)=>{const base=n+acc,idx=keyIndex(base);if(idx<0)return all;return KEYS[(idx+steps+120)%12]+rest.replace(/\/([A-G])([#b]?)/g,(m,n2,a2)=>{const i2=keyIndex(n2+a2);return i2<0?m:`/${KEYS[(i2+steps+120)%12]}`;});});}
  function transposeSelected(delta){const s=state.songs.find(x=>x.id===state.selectedSong);if(!s)return;const i=keyIndex(state.songKey||s.default_key);state.songKey=KEYS[(i+delta+12)%12];render();}
  function renderChordSheet(text,original,target){const steps=(keyIndex(target)-keyIndex(original)+12)%12;return esc(text).split('\n').map(line=>{const parts=line.split(/(\s+)/);return parts.map(part=>{const raw=part.replace(/&amp;/g,'&');if(/^[A-G](?:#|b)?(?:m|maj|min|sus|dim|aug|add|M)?\d*(?:\/[A-G](?:#|b)?)?$/.test(raw)){return `<span class="chord">${esc(transposeChord(raw,steps))}</span>`;}return part;}).join('');}).join('\n');}

  init();
})();
